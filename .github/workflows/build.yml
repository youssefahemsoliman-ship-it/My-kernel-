name: CI (Custom Kernel Builder)
on:
  workflow_dispatch:
    inputs:
      kernel-url:
        description: 'Kernel repository URL (e.g., https://github.com/user/kernel)'
        required: true
        type: string
      kernel-branch:
        description: 'Branch name (e.g., main or twelve)'
        required: true
        type: string
      config:
        description: 'defconfig file (e.g., vendor_defconfig)'
        required: true
        type: string
      arch:
        description: 'Kernel architecture (for 64-bit set arm64)'
        required: false
        default: 'arm64'
        type: string
      aosp-gcc:
        description: 'Use AOSP GCC toolchain'
        required: false
        default: true
        type: boolean
      aosp-clang:
        description: 'Use AOSP Clang toolchain'
        required: false
        default: true
        type: boolean
      android-version:
        description: 'Android version (e.g., 12, 13, 14, 15, 16)'
        required: false
        default: '16'
        type: string
      aosp-clang-version:
        description: 'Clang version (e.g., r383902 or r450784d)'
        required: false
        default: 'r383902'
        type: string
      anykernel3:
        description: 'Use AnyKernel3 to generate a flashable zip?'
        required: false
        default: true
        type: boolean
      release:
        description: 'Create a GitHub Release?'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel (${{ github.event.inputs.kernel-branch }})
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ${{ github.event.inputs.kernel-url }}
          kernel-branch: ${{ github.event.inputs.kernel-branch }}
          config: ${{ github.event.inputs.config }}
          arch: ${{ github.event.inputs.arch }}
          aosp-gcc: ${{ github.event.inputs.aosp-gcc }}
          aosp-clang: ${{ github.event.inputs.aosp-clang }}
          android-version: ${{ github.event.inputs.android-version }}
          aosp-clang-version: ${{ github.event.inputs.aosp-clang-version }}
          anykernel3: ${{ github.event.inputs.anykernel3 }}
          release: ${{ github.event.inputs.release }}
          access-token: ${{ secrets.GITHUB_TOKEN }}
