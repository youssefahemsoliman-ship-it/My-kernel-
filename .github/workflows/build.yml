name: Build Kernel SDM425
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev bison flex python3 libssl-dev

      - name: Compile Kernel
        run: |
          # Find where the kernel source is located
          KERNEL_DIR=$(find . -name "Makefile" -not -path "*/scripts/*" -printf '%h\n' | head -n 1)
          cd $KERNEL_DIR
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Instead of searching for a specific file, we tell it to use the default
          # This skips the "No rule to make target" error
          make defconfig || make alldefconfig
          
          # Start building
          make -j$(nproc --all)

      - name: Create Flashable Package
        run: |
          mkdir -p output
          find . -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" -exec cp {} output/ \;
          cd output && zip -r ../Kernel_Result.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-Kernel-Package
          path: Kernel_Result.zip
